name: CI identity-service

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-

      # contracts es un repo público: se compila e instala en el .m2 del runner.
      # Así no hace falta token ni registry (GitHub Packages Maven no es proxy).
      - name: Build cafeorbe-contracts
        run: |
          git clone --depth 1 https://github.com/CafeOrbe/cafeorbe-contracts.git /tmp/contracts
          cd /tmp/contracts && mvn -B install

      - name: Build and test
        run: mvn -B verify